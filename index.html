<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1220">
<title>鄭觀應・相機人物導覽</title>
<style>
:root{color-scheme:dark;--ink:#eef4ff;--muted:#b6c8dd;--accent:#d5aa6e;--surface:rgba(8,20,33,.82)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121d;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:pan-y;background:radial-gradient(ellipse at 50% 32%,#31465b 0%,#142738 40%,#07121d 100%)}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:transparent;transform:none}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,14,24,.52),transparent 26%,transparent 58%,rgba(4,14,24,.35) 87%,rgba(4,14,24,.62))}
#actor{position:absolute;bottom:16%;left:50%;width:55vw;max-width:430px;min-width:95px;transform:translateX(-50%);z-index:2;touch-action:none;user-select:none;filter:drop-shadow(0 12px 12px rgba(0,0,0,.24));cursor:default}
#actor.adjustable{outline:1.5px dashed var(--accent);outline-offset:5px;border-radius:8px;cursor:grab}
#actor.adjustable:active{cursor:grabbing}
#actorCanvas{position:relative;z-index:1;display:none;vertical-align:bottom;width:100%;height:auto}
#actorPlaceholder{aspect-ratio:9/16;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px dashed rgba(255,255,255,.35);border-radius:20px;background:linear-gradient(180deg,rgba(214,174,108,.07),rgba(8,23,35,.1));text-align:center;text-shadow:0 2px 8px black;pointer-events:none}
#actorPlaceholder .silhouette{font-size:58px;line-height:1}#actorPlaceholder small{font-size:11px;color:var(--muted);line-height:1.6;padding:0 12px}
.header{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(180deg,rgba(3,13,24,.7),transparent);pointer-events:none}
.kicker{font-size:10px;letter-spacing:.24em;color:#e6bb83;text-transform:uppercase;font-weight:700}.header h1{font-size:21px;letter-spacing:.1em;margin:6px 0 5px}.header p{font-size:11px;color:#dce9f5;margin:0;max-width:290px}
#hint{position:absolute;z-index:3;top:43%;width:100%;padding:0 18px;pointer-events:none;text-align:center;color:#e6eef7;text-shadow:0 2px 4px #000;font-size:14px;line-height:1.6}
#hint.hide{display:none}
#toolbar{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9;padding:13px;border:1px solid rgba(255,255,255,.2);border-radius:20px;background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 16px 50px rgba(0,0,0,.28)}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.btn{border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(255,255,255,.1);color:#f8fafc;min-height:52px;padding:7px 4px;font-size:11px;font-weight:600;line-height:1.35}.btn span{display:block;font-size:18px;margin-bottom:1px}.btn.primary{background:#b48249;border-color:#e9c18a;color:#101820}.btn.active{background:rgba(213,170,110,.22);border-color:var(--accent)}
.subactions{display:flex;gap:9px;align-items:center;margin-top:9px;min-height:30px}.tiny{background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:9px;color:#deedfc;padding:6px 8px;font-size:11px}.subactions label{font-size:11px;color:#dce4ee;display:inline-flex;align-items:center;gap:4px}.subactions select{background:#162b3a;color:white;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:5px;font-size:11px;min-width:72px}.subactions input[type=range]{width:70px;accent-color:var(--accent)}
#adjustPanel{display:none;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid rgba(255,255,255,.15);padding-top:9px;margin-top:9px;font-size:11px;color:#e0ecf7}#adjustPanel.show{display:flex}
#status{font-size:11px;color:#bcd0e2;text-align:center;margin-top:8px;min-height:15px;line-height:1.3}#fileInput{display:none}#actorVideo{position:absolute;inset:0;opacity:.001;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:0}
#toast{position:absolute;z-index:30;left:20px;right:20px;bottom:200px;padding:12px 16px;max-width:500px;margin:auto;text-align:center;background:rgba(5,20,34,.92);border:1px solid rgba(255,255,255,.22);border-radius:12px;font-size:12px;line-height:1.5;display:none}
#toast.show{display:block}
#videoTest{font-size:11px;text-align:center;display:block;margin-top:5px;color:#e6c28f;text-decoration:underline;text-underline-offset:2px}
@media(min-width:700px){#toolbar{max-width:460px;margin:auto;left:0;right:0}#actor{width:280px}.header{padding-left:30px}#hint{font-size:16px}}
</style>
</head>
<body>
<main id="stage" aria-label="相機人物導覽視圖">
 <video id="camera" autoplay muted playsinline aria-label="手機相機預覽"></video>
 <div class="header"><div class="kicker">Mandarin's House • AI Heritage</div><h1>鄭觀應・時空相遇</h1><p>AI 歷史人物還原展示，非真實影像或實景定位 AR</p></div>
 <div id="actor" aria-label="鄭觀應人物位置"><video id="actorVideo" playsinline webkit-playsinline muted loop preload="auto" aria-label="鄭觀應預錄影片"></video><canvas id="actorCanvas"></canvas><div id="actorPlaceholder"><span class="silhouette">👤</span><strong>人物位置預覽</strong><small>請上傳 zheng.mp4 到網站根目錄<br>或按下方「選影片」測試</small></div></div>
 <div id="hint">點「啟動 AR」開啟相機。<br>zheng.mp4 會自動以靜音循環播放。</div>
 <input type="file" id="fileInput" accept="video/mp4,video/webm,.mp4,.webm" aria-label="選擇鄭觀應影片">
 <div id="toast" role="status"></div>
 <div id="toolbar">
   <div class="actions">
    <button type="button" id="cameraBtn" class="btn primary"><span>📷</span>啟動 AR</button>
    <button type="button" id="chooseBtn" class="btn"><span>🎞️</span>選影片</button>
    <button type="button" id="playBtn" class="btn" disabled><span>▶</span>播放人物</button>
    <button type="button" id="photoBtn" class="btn"><span>📸</span>合成拍照</button>
   </div>
   <div class="subactions">
    <button type="button" id="adjustBtn" class="tiny">調整人物位置</button>
    <label for="mode">影片：</label><select id="mode" aria-label="影片背景處理"><option value="chroma">綠幕去背</option><option value="alpha">已透明</option></select>
    <button type="button" id="switchCameraBtn" class="tiny" title="前後鏡頭切換">切鏡頭</button>
    <button type="button" id="soundBtn" class="tiny" disabled>開啟聲音</button>
   </div>
   <div id="adjustPanel">
     <label for="size">人物大小：<input id="size" type="range" min="20" max="95" value="55"></label>
     <span>拖動人物調位置</span><button type="button" id="resetBtn" class="tiny">置中</button><button type="button" id="lockBtn" class="tiny">完成鎖定</button>
   </div>
   <div id="status">正在檢查 zheng.mp4…</div><a id="videoTest" target="_blank" rel="noopener noreferrer">檢查影片網址：zheng.mp4</a>
 </div>
</main>
<script>
(()=>{'use strict';
const $=s=>document.getElementById(s);
const stage=$('stage'), camera=$('camera'), actor=$('actor'),actorVideo=$('actorVideo');
const canvas=$('actorCanvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
const off=document.createElement('canvas'),offCtx=off.getContext('2d',{willReadFrequently:true});
const fileInput=$('fileInput'), status=$('status'), playBtn=$('playBtn'), size=$('size');
let stream=null,facing='environment',objectUrl=null,ready=false,adjust=false,dragging=false,arStarted=false;
let lastFrame=0,framesRunning=false,actorPercentX=50,actorPercentBottom=16,actorWidth=55,toastTimeout;
const clamp=(x,min,max)=>Math.min(max,Math.max(min,x));
function announce(t){status.textContent=t;}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('toast').classList.remove('show'),3600);}
const remoteVideoUrl=new URL('./zheng.mp4',document.baseURI);$('videoTest').href=remoteVideoUrl.href;
function position(){actor.style.left=actorPercentX+'%';actor.style.bottom=actorPercentBottom+'%';actor.style.width=actorWidth+'vw';actor.style.maxWidth='430px';size.value=actorWidth;}
function savePosition(){try{localStorage.setItem('zg_ar_position',JSON.stringify({x:actorPercentX,b:actorPercentBottom,w:actorWidth}));}catch(e){}}
try{const p=JSON.parse(localStorage.getItem('zg_ar_position')||'null');if(p&&Number.isFinite(p.x)&&Number.isFinite(p.b)&&Number.isFinite(p.w)){actorPercentX=clamp(p.x,6,94);actorPercentBottom=clamp(p.b,5,75);actorWidth=clamp(p.w,20,95);}}catch(e){}
// QR Code 可以指定固定畫面位置，例如 ?x=45&bottom=20&w=55
const params=new URLSearchParams(location.search);
if(params.has('x')&&Number.isFinite(+params.get('x')))actorPercentX=clamp(+params.get('x'),0,100);
if(params.has('bottom')&&Number.isFinite(+params.get('bottom')))actorPercentBottom=clamp(+params.get('bottom'),0,90);
if(params.has('w')&&Number.isFinite(+params.get('w')))actorWidth=clamp(+params.get('w'),20,95);
position();
async function startCamera(){
 if(!navigator.mediaDevices?.getUserMedia){announce('攝像頭需要 HTTPS 或 localhost 網站環境');toast('請使用 HTTPS 網址開啟本頁，或在 localhost 測試。');return;}
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 try{
   announce('正在請求相機授權…');
   stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});
   camera.srcObject=stream;camera.muted=true;await camera.play();
   arStarted=true;$('hint').classList.add('hide');announce('相機已開啟'+(ready?'・正在播放人物':'・等待 zheng.mp4 載入'));
   $('cameraBtn').classList.add('active');
   if(ready)await autoPlayActor();
 }catch(err){console.error(err);announce('相機啟動失敗：'+err.name);toast('相機無法開啟：請允許瀏覽器使用相機，並用 HTTPS 開啟。');}
}
$('cameraBtn').addEventListener('click',startCamera);
$('switchCameraBtn').addEventListener('click',()=>{facing=facing==='environment'?'user':'environment';startCamera();});
$('chooseBtn').addEventListener('click',()=>fileInput.click());
function prepareVideo(src){
 ready=false;playBtn.disabled=true;actorVideo.pause();actorVideo.muted=true;$('soundBtn').disabled=true;$('soundBtn').textContent='開啟聲音';
 actorVideo.src=src;actorVideo.load();announce('正在讀取人物影片…');
}
fileInput.addEventListener('change',()=>{
 const file=fileInput.files?.[0];if(!file)return;
 if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}
 objectUrl=URL.createObjectURL(file);
 prepareVideo(objectUrl);
 fileInput.value='';
});
actorVideo.addEventListener('loadedmetadata',()=>{
 if(!actorVideo.videoWidth||!actorVideo.videoHeight){toast('影片沒有可讀取的畫面。');return;}
 const w=Math.min(actorVideo.videoWidth,420);
 const h=Math.max(1,Math.round(w*actorVideo.videoHeight/actorVideo.videoWidth));
 off.width=canvas.width=w;off.height=canvas.height=h;
 actor.style.aspectRatio=actorVideo.videoWidth+'/'+actorVideo.videoHeight;
 canvas.style.display='block';$('actorPlaceholder').style.display='none';
 ready=true;playBtn.disabled=false;$('soundBtn').disabled=false;announce('影片已載入'+(arStarted?'，正在啟動人物…':'，按「啟動 AR」後將自動播放'));
 if(arStarted)autoPlayActor();
 if(!framesRunning){framesRunning=true;requestAnimationFrame(drawActor);}
 drawSingleFrame();
});
actorVideo.addEventListener('error',()=>{
 if(objectUrl){announce('選擇的影片無法播放，請使用 H.264 MP4 或相容 WebM');toast('影片讀取失敗，請改用 MP4。');}
 else{announce('未能載入 zheng.mp4：請打開下方影片網址，檢查是否 404 或無法播放');toast('缺少 zheng.mp4？請把影片上傳到 index.html 同一層，檔名需完全一致。');}
});
actorVideo.addEventListener('ended',()=>{playBtn.innerHTML='<span>↻</span>重播人物';announce('影片播放完畢，可按「重播人物」');});
async function autoPlayActor(){
 if(!ready||!arStarted)return;
 actorVideo.muted=true; // iOS / Android 可在用戶啟用鏡頭後靜音自動播放
 try{await actorVideo.play();playBtn.innerHTML='<span>⏸</span>暫停人物';announce('AR 已啟動・鄭觀應影片正在循環播放（靜音）');}
 catch(err){console.warn('人物自動播放未成功',err);announce('相機已開啟；請再按「播放人物」');}
}
$('soundBtn').addEventListener('click',async()=>{
 if(!ready)return;
 if(actorVideo.muted){actorVideo.muted=false;try{await actorVideo.play();$('soundBtn').textContent='關閉聲音';announce('人物播放中・聲音已啟用');}catch(err){actorVideo.muted=true;toast('瀏覽器阻止有聲播放，請按「播放人物」再試');}}
 else{actorVideo.muted=true;$('soundBtn').textContent='開啟聲音';announce('人物播放中・靜音');}
});
function drawSingleFrame(){if(!ready||actorVideo.readyState<2)return;
 try{
  offCtx.clearRect(0,0,off.width,off.height);offCtx.drawImage(actorVideo,0,0,off.width,off.height);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if($('mode').value==='alpha'){ctx.drawImage(off,0,0);return;}
  const img=offCtx.getImageData(0,0,off.width,off.height),data=img.data;
  for(let i=0;i<data.length;i+=4){
   const r=data[i],g=data[i+1],b=data[i+2],max=Math.max(r,b),diff=g-max;
   if(g>65&&diff>22){const remove=clamp((diff-22)/52,0,1);data[i+3]=Math.round(data[i+3]*(1-remove));
     if(remove<1)data[i+1]=Math.min(g,max*1.13+12);
   }
  }
  ctx.putImageData(img,0,0);
 }catch(err){console.error(err);announce('去背失敗：請確認影片來自本站或本機選取');}
}
function drawActor(ts){
 if(!framesRunning)return;
 if(!lastFrame||ts-lastFrame>=45){lastFrame=ts;if(ready&&actorVideo.readyState>=2)drawSingleFrame();}
 requestAnimationFrame(drawActor);
}
$('mode').addEventListener('change',()=>{drawSingleFrame();announce($('mode').value==='chroma'?'使用綠幕去背模式':'使用原有透明通道（播放器須支援）');});
playBtn.addEventListener('click',async()=>{
 if(!ready)return;
 if(actorVideo.paused){
  try{if(actorVideo.ended)actorVideo.currentTime=0;await actorVideo.play();playBtn.innerHTML='<span>⏸</span>暫停人物';announce('人物正在播放');}
  catch(err){announce('影片播放被瀏覽器阻止：請再點擊播放');toast('請直接點擊「播放人物」允許播放影片及聲音。');}
 }else{actorVideo.pause();playBtn.innerHTML='<span>▶</span>繼續人物';announce('人物已暫停');}
});
$('adjustBtn').addEventListener('click',()=>{adjust=!adjust;actor.classList.toggle('adjustable',adjust);$('adjustPanel').classList.toggle('show',adjust);$('adjustBtn').classList.toggle('active',adjust);$('adjustBtn').textContent=adjust?'調整中':'調整人物位置';announce(adjust?'拖曳人物調整位置，拖動滑桿改變大小':'人物位置已鎖定');if(!adjust)savePosition();});
$('lockBtn').addEventListener('click',()=>$('adjustBtn').click());
$('resetBtn').addEventListener('click',()=>{actorPercentX=50;actorPercentBottom=16;actorWidth=55;position();savePosition();announce('人物已恢復預設位置');});
size.addEventListener('input',e=>{actorWidth=+e.target.value;position();savePosition();});
let dragStart=null;
actor.addEventListener('pointerdown',e=>{if(!adjust)return;dragging=true;dragStart={x:e.clientX,y:e.clientY,pX:actorPercentX,pB:actorPercentBottom};actor.setPointerCapture(e.pointerId);e.preventDefault();});
actor.addEventListener('pointermove',e=>{if(!dragging||!dragStart)return;const r=stage.getBoundingClientRect();actorPercentX=clamp(dragStart.pX+((e.clientX-dragStart.x)/r.width*100),0,100);actorPercentBottom=clamp(dragStart.pB-((e.clientY-dragStart.y)/r.height*100),0,90);position();e.preventDefault();});
function stopDrag(){if(dragging){dragging=false;dragStart=null;savePosition();}}
actor.addEventListener('pointerup',stopDrag);actor.addEventListener('pointercancel',stopDrag);
$('photoBtn').addEventListener('click',async()=>{
 if(camera.readyState<2){toast('請先開啟相機，才能合成拍照。');return;}
 try{
  const r=stage.getBoundingClientRect(),out=document.createElement('canvas');
  const ratio=Math.min(window.devicePixelRatio||1,2);
  out.width=Math.round(r.width*ratio);out.height=Math.round(r.height*ratio);
  const g=out.getContext('2d');
  const vw=camera.videoWidth,vh=camera.videoHeight,target=out.width/out.height,source=vw/vh;
  if(source>target){const sw=vh*target;g.drawImage(camera,(vw-sw)/2,0,sw,vh,0,0,out.width,out.height);}
  else{const sh=vw/target;g.drawImage(camera,0,(vh-sh)/2,vw,sh,0,0,out.width,out.height);}
  if(ready){const a=actor.getBoundingClientRect();g.drawImage(canvas,(a.left-r.left)*ratio,(a.top-r.top)*ratio,a.width*ratio,a.height*ratio);}
  g.fillStyle='rgba(0,0,0,.46)';g.fillRect(0,out.height-32*ratio,out.width,32*ratio);
  g.fillStyle='#ffffff';g.font=(12*ratio)+'px sans-serif';g.textAlign='center';g.fillText('鄭觀應・AI 歷史人物還原展示',out.width/2,out.height-12*ratio);
  out.toBlob(async blob=>{
   if(!blob){toast('照片生成失敗');return;}
   const file=new File([blob],'zheng-guanying-ar.png',{type:'image/png'});
   if(navigator.canShare?.({files:[file]})){
    try{await navigator.share({files:[file],title:'鄭觀應 AI 合照'});return;}
    catch(e){if(e.name==='AbortError')return;}
   }
   const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='zheng-guanying-ar.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
   toast('照片已產生。若手機未自動儲存，請使用分享或長按儲存。');
  },'image/png');
 }catch(err){console.error(err);toast('合成照片失敗，請檢查相機是否正常運作。');}
});
window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(objectUrl)URL.revokeObjectURL(objectUrl);});
// 自動載入本站根目錄的影片。GitHub Pages 需把影片與 index.html 放在相同發佈目錄。
prepareVideo(remoteVideoUrl.href);
})();
</script>
</body>
</html>
